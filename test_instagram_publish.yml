name: Test Instagram Publish

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "Public direct JPG URL"
        required: true
        type: string
      caption:
        description: "Instagram caption"
        required: true
        default: |
          📊 SHARQ FX — Daily Forex Calendar

          High, Medium & Low impact economic events.
          All event times are converted to IST.

          Follow @shar_qfx for daily market updates.

          #SharQFX #Forex #ForexNews #EconomicCalendar #TradingEducation
        type: string

permissions:
  contents: read

jobs:
  publish-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Publish test image to Instagram
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: v22.0
          IMAGE_URL: ${{ inputs.image_url }}
          CAPTION: ${{ inputs.caption }}
        run: python instagram_publish_test.py
